[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # import sorting
  "B",  # bugbear (likely bugs)
  "UP", # pyupgrade (modern syntax)
]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so tests can import the ingest package without
# installing it. `python -m pytest` does this implicitly; bare `pytest` does not,
# and CI runs the bare form via `make check`.
pythonpath = ["."]
